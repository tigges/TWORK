<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="twork-version" content="%TWORK_VERSION%" />
    <title>TWork</title>
    <script>
      // Apply saved theme before React hydrates to avoid flash
      const saved = localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark')
      }
      try {
        const vars = JSON.parse(localStorage.getItem('twork.accent.vars') || 'null')
        if (vars && typeof vars === 'object') {
          for (const [key, value] of Object.entries(vars)) {
            if (typeof value === 'string' && key.startsWith('--color-indigo-')) {
              document.documentElement.style.setProperty(key, value)
            }
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
