# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.synology.yml — Synology NAS overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.synology.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  postgres:
    volumes:
      - /volume1/docker/ybot/pgdata:/var/lib/postgresql/data

  valkey:
    volumes:
      - /volume1/docker/ybot/valkey:/data

  minio:
    volumes:
      - /volume1/docker/ybot/minio:/data

  caddy:
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /volume1/docker/ybot/caddy/data:/data
      - /volume1/docker/ybot/caddy/config:/config
    ports:
      - "8080:80"    # Use 8080 to avoid conflicts with DSM on port 80
      - "8443:443"

  # Ollama runs natively on NAS or another machine; point to it
  api:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
